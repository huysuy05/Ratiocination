# Alembic configuration for Ratiocination (SPEC §2.1, §4).
#
# The application runs migrations programmatically (radar.db.init_db -> alembic upgrade head).
# From the command line, run Alembic from backend/:
#     ../.venv/bin/alembic upgrade head
# The database URL comes from radar.config.get_settings() (RADAR_DATABASE_URL / RADAR_DATA_DIR)
# unless sqlalchemy.url below is set.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
